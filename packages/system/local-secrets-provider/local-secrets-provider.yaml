# Unified Connections wiring: the secrets list is received as the 'secrets'
# parameter (formerly resolved by reading the .Context.* blob). This package is
# a local stand-in for a secret manager, so credentials provisioning stays out
# of the platform model.
apiVersion: v1alpha1
name: local-secrets-provider
tag: 2.0.0-alpha.1 # x-release-please-version
description: |
  Provisions the Kubernetes secrets required by the platform services from a static list
  given as a parameter. A local stand-in for an external secret manager in sandbox environments.
usage:
  text: |
    Provisions the Kubernetes secrets listed in the 'secrets' parameter.
    Each entry creates one Secret holding the given data keys.
# OKDP package descriptor (contract 0.2). Name and version are the name and tag
# above. Its parameters are the single source of schema.parameters below.
extensions:
  okdp.io:
    apiVersion: okdp.io/v1alpha1
    kind: PackageDescriptor
    appVersion: 1.0.0
    displayName: Local secrets provider
    description: Kubernetes Secrets written from a static list, a stand-in for a secrets manager in sandboxes
    category: security
    maturity: beta
    edition: community
    license: Apache-2.0
    documentation: https://github.com/OKDP/sandbox-dependencies
    maintainer: OKDP
    keywords: [secrets, sandbox]
    capabilities:
      - name: okdp.io/secrets-backend
    # The Secrets are replicated to every namespace by the replicator of the platform tools.
    dependencies:
      - capability: okdp.io/platform-tools
        providerScope: system-wide
    compatibility:
      kubernetes: ">=1.28.0"
    parameters: &parameters
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      required: [secrets]
      properties:
        secrets:
          type: array
          title: Secrets
          description: "Secrets to provision. Each entry creates one Kubernetes Secret."
          x-okdp-group: Secrets
          x-okdp-order: 1
          items:
            type: object
            additionalProperties: false
            required: [name, data]
            properties:
              name:
                type: string
                minLength: 1
                description: "Name of the Kubernetes Secret to create."
              data:
                type: object
                additionalProperties: { type: string }
                description: "Key/value pairs stored in the Secret."
    lifecycle:
      applyTimeout: 10m
      rollback: supported

schema:
  parameters: *parameters
modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/local-secrets-provider
        tag: 0.1.0
    values: |
      # In order to have predictable behaviour, we provision the secrets statically
      secrets:
      {{- range $s := .Parameters.secrets }}
        - name: {{ $s.name | quote }}
      {{- with $s.data }}
      {{ toYaml . | indent 4 }}
      {{- end }}
      {{- end }}
roles:
  - okdp.io/secrets-backend
dependencies:
  - okdp.io/platform-tools
