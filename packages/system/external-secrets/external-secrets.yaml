# Carries the CRDs the Control Plane's secret-store and external-secret routes
# probe for. Without them both route groups answer 501.

apiVersion: v1alpha1
name: external-secrets
tag: 2.0.0-alpha.1 # x-release-please-version
description: |
  External Secrets Operator synchronizes secrets from external APIs (HashiCorp Vault, AWS Secrets
  Manager, and others) into Kubernetes Secrets.
usage:
  text: |
    The operator watches SecretStore and ExternalSecret resources in every namespace.
    The Control Plane exposes both under a project once a SecretStore points at a backend.
# OKDP package descriptor (contract 0.2). Name and version are the name and tag
# above. Its parameters are the single source of schema.parameters below.
extensions:
  okdp.io:
    apiVersion: okdp.io/v1alpha1
    kind: PackageDescriptor
    appVersion: 2.12.0
    displayName: External Secrets Operator
    description: Syncs secrets from the secrets manager into Kubernetes Secrets
    category: security
    maturity: stable
    edition: community
    license: Apache-2.0
    documentation: https://external-secrets.io/latest/
    maintainer: OKDP
    keywords: [secrets, external-secrets]
    capabilities:
      - name: okdp.io/secrets-sync
    compatibility:
      kubernetes: ">=1.28.0"
    parameters: &parameters
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      properties:
        installCRDs:
          type: boolean
          default: true
          title: CRDs
          x-okdp-group: Install
          x-okdp-order: 1
        webhookEnabled:
          type: boolean
          default: true
          title: Webhook
          description: "Install the webhook that validates SecretStore and ExternalSecret resources."
          x-okdp-group: Install
          x-okdp-order: 2
        certControllerEnabled:
          type: boolean
          default: true
          title: Certificate controller
          x-okdp-group: Install
          x-okdp-order: 3
        serveV1Beta1:
          type: boolean
          default: false
          title: Serve v1beta1
          description: "Keep serving the deprecated external-secrets.io/v1beta1 API, for clients not yet moved to v1. Temporary: the chart flag behind it is deprecated."
          x-okdp-group: Install
          x-okdp-order: 4
          x-okdp-advanced: true
        imageRepository:
          type: string
          minLength: 1
          default: "ghcr.io/external-secrets/external-secrets"
          title: Repository
          description: "Set a mirror here if ghcr.io is not reachable."
          x-okdp-group: Image
          x-okdp-order: 1
          x-okdp-advanced: true
    lifecycle:
      applyTimeout: 10m
      rollback: supported

schema:
  parameters: *parameters
  context:
    properties: {}
modules:
  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://charts.external-secrets.io
        chart: external-secrets
        version: "2.12.0"
    values: |
      installCRDs: {{ .Parameters.installCRDs }}
      crds:
        unsafeServeV1Beta1: {{ .Parameters.serveV1Beta1 }}
      # The chart carries three separate image blocks, one per deployment.
      image:
        repository: {{ .Parameters.imageRepository | quote }}
      webhook:
        create: {{ .Parameters.webhookEnabled }}
        image:
          repository: {{ .Parameters.imageRepository | quote }}
      certController:
        create: {{ .Parameters.certControllerEnabled }}
        image:
          repository: {{ .Parameters.imageRepository | quote }}
roles:
  - okdp.io/secrets-sync
dependencies: []
