# Consumes one database-server Connection (parameter db). Publishes none.

apiVersion: v1alpha1
name: keycloak
tag: 2.0.0-alpha.1 # x-release-please-version
description: |
  Keycloak identity and access management for Kubernetes
usage:
  text: |
    Keycloak provides centralized authentication and authorization.
    Access the admin console at https://keycloak.{{ .Context.ingress.suffix }}
    The admin password is in the Secret named by adminCredentialsSecret, key admin-password.
    The groups scope puts the user's groups, by short name, in the groups claim.
# OKDP package descriptor (contract 0.2). Name and version are the name and tag
# above. Its parameters are the single source of schema.parameters below.
extensions:
  okdp.io:
    apiVersion: okdp.io/v1alpha1
    kind: PackageDescriptor
    appVersion: 26.1.3
    displayName: Keycloak
    description: OIDC identity provider of the platform
    category: identity
    maturity: stable
    edition: community
    license: Apache-2.0
    documentation: https://www.keycloak.org/documentation
    maintainer: OKDP
    keywords: [oidc, sso, iam]
    capabilities:
      - name: okdp.io/identity-provider
    dependencies:
      - capability: okdp.io/platform-database
        providerScope: system-wide
      - capability: okdp.io/ingress
        providerScope: system-wide
      - capability: okdp.io/certificate-manager
        providerScope: system-wide
      - capability: okdp.io/secrets-backend
        providerScope: system-wide
    compatibility:
      kubernetes: ">=1.28.0"
    parameters: &parameters
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      required: [adminCredentialsSecret, db, realm]
      $defs:
        secretKeyRef:
          type: object
          additionalProperties: false
          required: [name, key]
          properties:
            name: { type: string, minLength: 1, x-okdp-secret-ref: true }
            key: { type: string, minLength: 1 }
        names:
          type: array
          items: { type: string }
        named:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, minLength: 1 }
        stringMap:
          type: object
          additionalProperties: { type: string }
      properties:
        adminUser:
          type: string
          minLength: 1
          default: "admin"
          title: Admin user
          x-okdp-group: Admin
          x-okdp-order: 1
        adminCredentialsSecret:
          type: string
          minLength: 1
          title: Admin credentials Secret
          description: "Secret holding the admin password under admin-password. Created beforehand: the package never receives a secret value."
          x-okdp-group: Admin
          x-okdp-order: 2
          x-okdp-secret-ref: true
        db:
          type: string
          minLength: 1
          title: Database connection
          description: "Name of the database-server Connection Keycloak stores its data in."
          x-okdp-group: Database
          x-okdp-order: 1
          x-okdp-connection: db
        memoryGi:
          type: number
          default: 2
          multipleOf: 0.25
          title: Memory (GiB)
          description: "Memory request. The limit is twice the request."
          x-okdp-group: Resources
          x-okdp-order: 1
          x-okdp-advanced: true
        cpu:
          type: number
          default: 0.5
          multipleOf: 0.25
          title: CPU
          description: "CPU request in vCPU. The limit is twice the request."
          x-okdp-group: Resources
          x-okdp-order: 2
          x-okdp-advanced: true
        realm:
          type: object
          additionalProperties: false
          required: [name]
          title: Realm
          x-okdp-group: Realm
          x-okdp-order: 1
          properties:
            name: { type: string, minLength: 1 }
            displayName: { type: string, default: "" }
            accessTokenLifespan: { type: integer, minimum: 1, default: 3600 }
            # At least accessTokenLifespan: Keycloak caps a token's life by the
            # session, so a shorter idle makes the declared lifespan unreachable.
            ssoSessionIdleTimeout: { type: integer, minimum: 1, default: 3600 }
            ssoSessionMaxLifespan: { type: integer, minimum: 1, default: 36000 }
        # DCR callers must be covered by trustedHosts, their extra scopes by
        # allowedScopes. The defaults live in the template because KuboCD panics
        # on a schema default for an array: ["*.<ingress suffix>",
        # "*.svc.cluster.local"] / ["groups"].
        #
        # Off by default: anonymous registration is only needed when the platform
        # provisions its clients through dcr, and it lets anyone reaching a
        # trusted host register a client without authenticating.
        #
        # Off does not mean "drop the policy": keycloak-config-cli removes from
        # the realm what the JSON stops declaring, and a realm with no
        # trusted-hosts policy accepts anonymous registrations from anywhere. It
        # means the policy trusts no host at all.
        #
        # It also answers what the arrays cannot: an unset array and one
        # explicitly emptied both reach the template as an empty list, so
        # emptying trustedHosts could never mean "trust nobody".
        anonymousDCR:
          type: object
          additionalProperties: false
          title: Anonymous registration
          x-okdp-group: DCR
          x-okdp-order: 1
          properties:
            enabled: { type: boolean, default: false, description: "Let a client register itself without authenticating, limited to trustedHosts. Off, the policy stays registered with no trusted host, which turns every anonymous registration down. Needed only when oidc.clientProvisioning is dcr." }
            trustedHosts: { $ref: "#/$defs/names" }
            allowedScopes: { $ref: "#/$defs/names" }
        users:
          type: array
          title: Users
          description: "passwordSecret names the Secret and key holding the user password."
          x-okdp-group: Identities
          x-okdp-order: 1
          items:
            type: object
            additionalProperties: false
            required: [username]
            properties:
              username: { type: string, minLength: 1 }
              email: { type: string }
              firstName: { type: string }
              lastName: { type: string }
              passwordSecret: { type: object, $ref: "#/$defs/secretKeyRef" }
              serviceAccountClientId: { type: string }
              roles: { $ref: "#/$defs/names" }
              groups: { $ref: "#/$defs/names" }
        groups:
          $ref: "#/$defs/named"
          title: Groups
          x-okdp-group: Identities
          x-okdp-order: 2
        roles:
          $ref: "#/$defs/named"
          title: Realm roles
          x-okdp-group: Identities
          x-okdp-order: 3
        clients:
          type: array
          title: Clients
          description: "secretRef names the Secret and key holding the secret of a confidential client."
          x-okdp-group: Clients
          x-okdp-order: 1
          items:
            type: object
            additionalProperties: false
            required: [clientId]
            properties:
              clientId: { type: string, minLength: 1 }
              name: { type: string }
              publicClient: { type: boolean }
              secretRef: { type: object, $ref: "#/$defs/secretKeyRef" }
              redirectUris: { $ref: "#/$defs/names" }
              webOrigins: { $ref: "#/$defs/names" }
              defaultClientScopes: { $ref: "#/$defs/names" }
              optionalClientScopes: { $ref: "#/$defs/names" }
              serviceAccountsEnabled: { type: boolean }
              standardFlowEnabled: { type: boolean }
              implicitFlowEnabled: { type: boolean }
              directAccessGrantsEnabled: { type: boolean }
        clientScopes:
          type: array
          title: Client scopes
          x-okdp-group: Clients
          x-okdp-order: 2
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: { type: string, minLength: 1 }
              description: { type: string }
              protocol: { type: string }
              attributes: { $ref: "#/$defs/stringMap" }
              protocolMappers:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [name]
                  properties:
                    name: { type: string, minLength: 1 }
                    protocol: { type: string }
                    protocolMapper: { type: string }
                    config: { $ref: "#/$defs/stringMap" }
    connections:
      consumes:
        - name: db
          contract: database-server
          version: "1"
          description: Database Keycloak stores its data in
    endpoints:
      - name: oidc
        kind: api
        protocol: http
        authentication: none
        description: OIDC endpoints of the realms
      - name: console
        kind: ui
        protocol: http
        authentication: credentials
        description: Admin console
    lifecycle:
      applyTimeout: 15m
      rollback: unsupported
      irreversible: "Keycloak migrates its database schema when it starts on a newer version."
    health:
      http: { endpoint: oidc, path: /realms/master }

schema:
  parameters: *parameters

inputs:
  - { contract: database-server, alias: db, fromParameter: db }

modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: registry-1.docker.io/bitnamicharts/keycloak
        tag: 24.4.11
    values: |

      {{- $dcr := (.Parameters.anonymousDCR | default dict) -}}
      {{- $dcrEnabled := $dcr.enabled -}}
      {{- $dcrTrustedHosts := ($dcr.trustedHosts | default (list (printf "*.%s" $.Context.ingress.suffix) "*.svc.cluster.local")) -}}
      {{- $dcrAllowedScopes := ($dcr.allowedScopes | default (list "groups")) -}}
      {{- range .Parameters.clientScopes }}
      {{- if eq .name "groups" }}{{ fail "clientScopes: groups is provided by the package" }}{{ end }}
      {{- end }}

      global:
        security:
          allowInsecureImages: true
      image:
        registry: quay.io
        repository: okdp/sandbox-images/keycloak
        tag: 26.1.3-debian-12-r0
      ingress:
        enabled: true
        ingressClassName: {{ .Context.ingress.className }}
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
          cert-manager.io/cluster-issuer: "{{ .Context.certificateIssuers.selfSigned.name }}"
        tls: true
        hostname: keycloak.{{ .Context.ingress.suffix }}

      auth:
        adminUser: "{{ .Parameters.adminUser }}"
        existingSecret: "{{ .Parameters.adminCredentialsSecret }}"
        passwordSecretKey: admin-password

      postgresql:
        enabled: false
      externalDatabase:
        host: "{{ .Inputs.db.host }}"
        port: "{{ .Inputs.db.port }}"
        database: {{ .Inputs.db.dbName }}
      extraEnvVars:
      - name: KC_DB
        value: 'postgres'
      - name: KC_DB_URL
        value: 'jdbc:{{ .Inputs.db.engine }}://{{ .Inputs.db.host }}:{{ .Inputs.db.port }}/{{ .Inputs.db.dbName }}'
      - name: KC_DB_USERNAME
        valueFrom:
          secretKeyRef:
            name: {{ .Inputs.db.secretRef }}
            key: username
      - name: KC_DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: {{ .Inputs.db.secretRef }}
            key: password
      - name: KC_METRICS_ENABLED
        value: "false"
      - name: KC_TRACING_ENABLED
        value: "false"
      - name: KC_CACHE
        value: "local"

      production: false
      cache:
        enabled: false

      resources:
        requests:
          cpu: "{{ mulf (float64 .Parameters.cpu) 1000 }}m"
          memory: "{{ .Parameters.memoryGi }}Gi"
        limits:
          cpu: "{{ mulf (float64 .Parameters.cpu) 2 }}"
          memory: "{{ mulf (float64 .Parameters.memoryGi) 2 }}Gi"

      keycloakConfigCli:
        image:
          registry: quay.io
          repository: okdp/sandbox-images/keycloak-config-cli
          tag: 6.4.0-debian-12-r0
        enabled: true
        # Secret values reach the realm JSON as $(env:...) through these variables.
        extraEnvVars:
          - name: IMPORT_VARSUBSTITUTION_ENABLED
            value: "true"
          {{- range $index, $user := .Parameters.users }}
          {{- with $user.passwordSecret }}
          - name: KC_USER_{{ $index }}_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .name | quote }}
                key: {{ .key | quote }}
          {{- end }}
          {{- end }}
          {{- range $index, $client := .Parameters.clients }}
          {{- with $client.secretRef }}
          - name: KC_CLIENT_{{ $index }}_SECRET
            valueFrom:
              secretKeyRef:
                name: {{ .name | quote }}
                key: {{ .key | quote }}
          {{- end }}
          {{- end }}
        configuration:
          master.json: |
            {
              "realm": "{{ .Parameters.realm.name }}",
              "enabled": true,
              "displayName": "{{ .Parameters.realm.displayName }}",
              "users": [
                {{- range $index, $user := .Parameters.users }}
                {{- if $index }},{{ end }}
                {
                  "username": "{{ $user.username }}",
                  "enabled": true,
                  "emailVerified": true,
                  "email": "{{ $user.email }}",
                  "firstName": "{{ $user.firstName }}",
                  "lastName": "{{ $user.lastName }}",
                  {{- if $user.passwordSecret }}
                  "credentials": [
                    {
                      "type": "password",
                      "value": "$(env:KC_USER_{{ $index }}_PASSWORD)"
                    }
                  ],
                  {{- end }}
                  {{- if $user.serviceAccountClientId }}
                  "serviceAccountClientId": "{{ $user.serviceAccountClientId }}",
                  {{- end }}
                  {{- if $user.groups }}
                  "groups": [{{ range $i, $g := $user.groups }}{{ if $i }},{{ end }}"/{{ $g }}"{{ end }}],
                  {{- end }}
                  "realmRoles": {{ toJson $user.roles }}
                }
                {{- end }}
              ],
              "groups": [
                {{- range $index, $group := .Parameters.groups }}
                {{- if $index }},{{ end }}
                {
                  "name": "{{ $group.name }}"
                }
                {{- end }}
              ],
              "roles": {
                "realm": [
                  {{- range $index, $role := .Parameters.roles }}
                  {{- if $index }},{{ end }}
                  {
                    "name": "{{ $role.name }}"
                  }
                  {{- end }}
                ]
              },
              "clients": [
                {{- range $index, $client := .Parameters.clients }}
                {{- if $index }},{{ end }}
                {
                  "clientId": "{{ $client.clientId }}",
                  "name": "{{ $client.name }}",
                  {{- if $client.publicClient }}
                  "publicClient": {{ $client.publicClient }},
                  {{- else if $client.secretRef }}
                  "secret": "$(env:KC_CLIENT_{{ $index }}_SECRET)",
                  {{- end }}
                  "redirectUris": [
                    {{- range $uriIndex, $uri := $client.redirectUris }}
                    {{- if $uriIndex }},{{ end }}
                    "{{ $uri }}"
                    {{- end }}
                  ],
                  "webOrigins": [
                    {{- range $originIndex, $origin := $client.webOrigins }}
                    {{- if $originIndex }},{{ end }}
                    "{{ $origin }}"
                    {{- end }}
                  ]
                  {{- if $client.defaultClientScopes }},
                  "defaultClientScopes": {{ toJson $client.defaultClientScopes }}
                  {{- end }}
                  {{- if $client.optionalClientScopes }},
                  "optionalClientScopes": {{ toJson $client.optionalClientScopes }}
                  {{- end }}
                  {{- if $client.serviceAccountsEnabled }},
                  "serviceAccountsEnabled": {{ $client.serviceAccountsEnabled }}
                  {{- end }}
                  {{- if hasKey $client "standardFlowEnabled" }},
                  "standardFlowEnabled": {{ $client.standardFlowEnabled }}
                  {{- end }}
                  {{- if hasKey $client "implicitFlowEnabled" }},
                  "implicitFlowEnabled": {{ $client.implicitFlowEnabled }}
                  {{- end }}
                  {{- if hasKey $client "directAccessGrantsEnabled" }},
                  "directAccessGrantsEnabled": {{ $client.directAccessGrantsEnabled }}
                  {{- end }}
                }
                {{- end }}
              ],
              "clientScopes": [
                {
                  "id": "groups-scope-id",
                  "name": "groups",
                  "description": "Groups the user belongs to",
                  "protocol": "openid-connect",
                  "attributes": {
                    "display.on.consent.screen": "true",
                    "include.in.token.scope": "true"
                  },
                  "protocolMappers": [
                    {
                      "id": "groups-mapper-id",
                      "name": "groups",
                      "protocol": "openid-connect",
                      "protocolMapper": "oidc-group-membership-mapper",
                      "consentRequired": false,
                      "config": {
                        "access.token.claim": "true",
                        "claim.name": "groups",
                        "full.path": "false",
                        "id.token.claim": "true",
                        "introspection.token.claim": "true",
                        "userinfo.token.claim": "true"
                      }
                    }
                  ]
                }
                {{- range $index, $scope := .Parameters.clientScopes }},
                {
                  "id": "{{ $scope.name }}-scope-id",
                  "name": "{{ $scope.name }}",
                  "description": "{{ $scope.description }}",
                  "protocol": "{{ $scope.protocol }}",
                  "attributes": {
                    {{- $attrKeys := keys ($scope.attributes | default dict) | sortAlpha }}
                    {{- range $attrIndex, $key := $attrKeys }}
                    {{- if $attrIndex }},{{ end }}
                    "{{ $key }}": "{{ index $scope.attributes $key }}"
                    {{- end }}
                  },
                  "protocolMappers": [
                    {{- range $mapperIndex, $mapper := $scope.protocolMappers }}
                    {{- if $mapperIndex }},{{ end }}
                    {
                      "id": "{{ $mapper.name }}-mapper-id",
                      "name": "{{ $mapper.name }}",
                      "protocol": "{{ $mapper.protocol }}",
                      "protocolMapper": "{{ $mapper.protocolMapper }}",
                      "consentRequired": false,
                      "config": {
                        {{- $configKeys := keys ($mapper.config | default dict) | sortAlpha }}
                        {{- range $configIndex, $key := $configKeys }}
                        {{- if $configIndex }},{{ end }}
                        "{{ $key }}": "{{ index $mapper.config $key }}"
                        {{- end }}
                      }
                    }
                    {{- end }}
                  ]
                }
                {{- end }}
              ],
              "accessTokenLifespan": {{ .Parameters.realm.accessTokenLifespan }},
              "ssoSessionIdleTimeout": {{ .Parameters.realm.ssoSessionIdleTimeout }},
              "ssoSessionMaxLifespan": {{ .Parameters.realm.ssoSessionMaxLifespan }},
              "components": {
                "org.keycloak.services.clientregistration.policy.ClientRegistrationPolicy": [
                  {
                    "name": "Trusted Hosts",
                    "providerId": "trusted-hosts",
                    "subType": "anonymous",
                    "config": {
                      "host-sending-registration-request-must-match": ["true"],
                      "client-uris-must-match": ["true"],
                      {{- if $dcrEnabled }}
                      "trusted-hosts": ["{{ $dcrTrustedHosts | join "\", \"" | replace "{{ .Context.ingress.suffix }}" $.Context.ingress.suffix }}"]
                      {{- else }}
                      "trusted-hosts": []
                      {{- end }}
                    }
                  },
                  {
                    "name": "Allowed Client Scopes",
                    "providerId": "allowed-client-templates",
                    "subType": "anonymous",
                    "config": {
                      "allow-default-scopes": [
                        "true"
                      ],
                      "allowed-client-scopes": [
                        "{{ $dcrAllowedScopes | join "\", \"" }}"
                      ]
                    }
                  }
                ]
              }
            }
roles:
  - okdp.io/identity-provider
dependencies:
  - okdp.io/platform-database
  - okdp.io/ingress
  - okdp.io/certificate-manager
  - okdp.io/secrets-backend
# No outputs: the OIDC coordinates are platform Context values, not a
# connection one service would provide to the others.
