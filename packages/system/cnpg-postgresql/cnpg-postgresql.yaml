# Unified Connections wiring: the logical databases are received as the
# 'databases' parameter (formerly .Context.defaultDatabaseServer.settings.databases)
# and the package outputs one database-server Connection per database, with the
# owner passwordSecret published as secretRef.
apiVersion: v1alpha1
name: cnpg-postgresql
tag: 2.0.0 # x-release-please-version
description: |
  Defines multiple logical PostgreSQL databases managed by the CloudNativePG operator within a single PostgreSQL
  instance (cluster) and includes ownership, access credentials, and lifecycle management through Kubernetes-native CRDs.
usage:
  text: |
    Databases instances used in the sandbox
# OKDP package descriptor (contract 0.2). Name and version are the name and tag
# above. Its parameters are the single source of schema.parameters below.
extensions:
  okdp.io:
    apiVersion: okdp.io/v1alpha1
    kind: PackageDescriptor
    appVersion: "18.3"
    displayName: PostgreSQL
    description: PostgreSQL server of the platform services, one logical database per service
    category: database
    maturity: stable
    edition: community
    license: PostgreSQL
    documentation: https://cloudnative-pg.io/documentation/current/
    maintainer: OKDP
    keywords: [postgresql, database]
    capabilities:
      - name: okdp.io/platform-database
    dependencies:
      - capability: okdp.io/operator/postgresql.cnpg.io
        providerScope: system-wide
      - capability: okdp.io/secrets-backend
        providerScope: system-wide
    compatibility:
      kubernetes: ">=1.31.0"
    parameters: &parameters
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      properties:
        databases:
          type: array
          title: Databases
          description: "Logical databases. Each one is published as a database-server connection named after it."
          x-okdp-group: Databases
          x-okdp-order: 1
          items:
            type: object
            additionalProperties: false
            required: [name, owner]
            properties:
              name: { type: string, minLength: 1 }
              owner:
                type: object
                additionalProperties: false
                required: [username, passwordSecret]
                properties:
                  username: { type: string, minLength: 1 }
                  passwordSecret:
                    type: string
                    minLength: 1
                    description: "Secret holding the owner credentials under username and password, also handed to the consumers."
                    x-okdp-secret-ref: true
              schemas:
                type: array
                items: { type: string }
    endpoints:
      - name: postgresql
        kind: api
        protocol: tcp
        authentication: credentials
        description: PostgreSQL protocol, read-write service
    data:
      - name: data
        kind: database
        description: Every logical database of the server
        backup: https://cloudnative-pg.io/documentation/current/backup/
    lifecycle:
      applyTimeout: 10m
      rollback: supported
    health:
      tcp: { endpoint: postgresql }

schema:
  parameters: *parameters
modules:
  - name: main
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/cnpg-postgresql
        tag: 0.1.0
    values: |
      replicaCount: 1
      fullnameOverride: {{ .Release.metadata.name }}

      image:
        repository: ghcr.io/cloudnative-pg/postgresql
        pullPolicy: IfNotPresent
        tag: 18.3

      storage:
        size: 2Gi
        class: standard

      databases:
      {{ toYaml .Parameters.databases | indent 4 }}
# One database-server Connection per logical database, named kcd-<release>-<db>.
outputs: |
  {{- range .Parameters.databases }}
  - name: "{{ .name }}"
    contract: database-server
    values:
      engine: postgresql
      driver: org.postgresql.Driver
      host: "{{ $.Release.metadata.name }}-rw.{{ $.Release.spec.targetNamespace }}.svc.cluster.local"
      port: 5432
      dbName: "{{ .name }}"
      secretRef: "{{ .owner.passwordSecret }}"
  {{- end }}
roles:
  - okdp.io/platform-database
dependencies:
  - okdp.io/operator/postgresql.cnpg.io
  - okdp.io/secrets-backend
