apiVersion: v1alpha1
name: ingress-nginx
tag: 2.0.0-alpha.1 # x-release-please-version
description: |
  NGINX Ingress Controller for Kubernetes with support for multiple deployment modes
usage:
  text: |
    NGINX Ingress Controller provides HTTP and HTTPS routing to services in Kubernetes.
    Supports multiple deployment modes:
    - nodePort: Exposes services via NodePort (default for Kind clusters)
    - hostPort: Uses host networking for direct port binding
    - metallb: Uses MetalLB LoadBalancer for external access
# OKDP package descriptor (contract 0.2). Name and version are the name and tag
# above. Its parameters are the single source of schema.parameters below.
extensions:
  okdp.io:
    apiVersion: okdp.io/v1alpha1
    kind: PackageDescriptor
    appVersion: 1.12.1
    displayName: Ingress NGINX
    description: HTTP and HTTPS entry point of the cluster
    category: platform
    maturity: stable
    edition: community
    license: Apache-2.0
    documentation: https://kubernetes.github.io/ingress-nginx/
    maintainer: OKDP
    keywords: [ingress, nginx]
    capabilities:
      - name: okdp.io/ingress
    compatibility:
      kubernetes: ">=1.28.0"
    parameters: &parameters
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: ["nodePort", "hostPort", "metallb"]
          default: "nodePort"
          title: Mode
          description: "How the controller is exposed: NodePort (default for Kind clusters), host network, or a MetalLB load balancer."
          x-okdp-group: Exposure
          x-okdp-order: 1
        endpoint:
          type: string
          format: ipv4
          title: Load balancer IP
          description: "IP address requested from MetalLB. Required in metallb mode."
          x-okdp-group: Exposure
          x-okdp-order: 2
        httpPort:
          type: integer
          default: 30080
          minimum: 30000
          maximum: 32767
          title: HTTP node port
          description: "HTTP port in nodePort mode."
          x-okdp-group: Exposure
          x-okdp-order: 3
        httpsPort:
          type: integer
          default: 30443
          minimum: 30000
          maximum: 32767
          title: HTTPS node port
          description: "HTTPS port in nodePort mode."
          x-okdp-group: Exposure
          x-okdp-order: 4
      if:
        properties:
          mode: { const: metallb }
        required: [mode]
      then:
        required: [endpoint]
    endpoints:
      - name: http
        kind: api
        protocol: http
        authentication: none
        description: Entry point of every ingress of the cluster
    sideEffects:
      clusterResources:
        - kind: IngressClass
          name: nginx
    lifecycle:
      applyTimeout: 10m
      rollback: supported
    health:
      http: { endpoint: http, path: /healthz }

schema:
  parameters: *parameters
modules:
  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://kubernetes.github.io/ingress-nginx
        chart: ingress-nginx
        version: 4.12.1
    values: |
      controller:
        allowSnippetAnnotations: "false"
        extraArgs:
          enable-ssl-passthrough: true
        admissionWebhooks:
          enabled: true
        {{- if eq .Parameters.mode "metallb" }}
        service:
          annotations:
            metallb.universe.tf/loadBalancerIPs: {{ .Parameters.endpoint }}
            metallb.universe.tf/allow-shared-ip: "ingress"
        {{- end }}
        {{- if eq .Parameters.mode "hostPort" }}
        hostNetwork: true
        hostPort:
          enabled: true
        service:
          enabled: false
        {{- end }}
        {{- if eq .Parameters.mode "nodePort" }}
        service:
          type: NodePort
          nodePorts:
            http: "{{ .Parameters.httpPort }}"
            https: "{{ .Parameters.httpsPort }}"
        {{- end }}
roles:
  - okdp.io/ingress
dependencies: []