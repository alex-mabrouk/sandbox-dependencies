apiVersion: v1alpha1
name: tools
tag: 2.0.0-alpha.1 # x-release-please-version
description: |
  Miscellaneous Kubernetes tools: replicator and secret-generator
usage:
  text: |
    Tools package provides useful utilities for Kubernetes clusters:
    - Replicator: Replicates secrets/configmaps between namespaces
    - Secret Generator: Automatically generates secrets
# OKDP package descriptor (contract 0.2). Name and version are the name and tag
# above. Its parameters are the single source of schema.parameters below.
extensions:
  okdp.io:
    apiVersion: okdp.io/v1alpha1
    kind: PackageDescriptor
    appVersion: 1.0.0
    displayName: Platform tools
    description: Secret and ConfigMap replication between namespaces, and generated secrets
    category: platform
    maturity: stable
    edition: community
    license: Apache-2.0
    documentation: https://github.com/mittwald/kubernetes-replicator
    maintainer: OKDP
    keywords: [replicator, secret-generator]
    capabilities:
      - name: okdp.io/platform-tools
    compatibility:
      kubernetes: ">=1.28.0"
    parameters: &parameters
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      properties:
        replicator:
          type: object
          additionalProperties: false
          title: Replicator
          description: "kubernetes-replicator, copies Secrets and ConfigMaps between namespaces."
          x-okdp-group: Tools
          x-okdp-order: 1
          properties:
            enabled: { type: boolean, default: true }
        secretGenerator:
          type: object
          additionalProperties: false
          title: Secret generator
          description: "kubernetes-secret-generator, fills Secrets with generated values."
          x-okdp-group: Tools
          x-okdp-order: 2
          properties:
            enabled: { type: boolean, default: true }
    lifecycle:
      applyTimeout: 10m
      rollback: supported

schema:
  parameters: *parameters
modules:
  - name: replicator
    enabled: "{{ .Parameters.replicator.enabled }}"
    timeout: 10m
    source:
      helmRepository:
        url: https://helm.mittwald.de
        chart: kubernetes-replicator
        version: 2.9.2
    values: |
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        capabilities:
          drop:
            - ALL
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      livenessProbe:
        initialDelaySeconds: 10
      readinessProbe:
        initialDelaySeconds: 10

  - name: secret-generator
    enabled: "{{ .Parameters.secretGenerator.enabled }}"
    timeout: 10m
    source:
      helmRepository:
        url: https://helm.mittwald.de
        chart: kubernetes-secret-generator
        version: 3.4.0
    values: |
      fullnameOverride: secret-generator
      podSecurityContext:
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
roles:
  - okdp.io/platform-tools
dependencies: []