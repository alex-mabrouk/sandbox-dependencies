apiVersion: v1alpha1
name: cert-manager
tag: 2.0.0-alpha.2 # x-release-please-version
# OKDP package descriptor (contract 0.2). Name and version are the name and tag
# above. Its parameters are the single source of schema.parameters below.
extensions:
  okdp.io:
    apiVersion: okdp.io/v1alpha1
    kind: PackageDescriptor
    appVersion: 1.20.4
    displayName: cert-manager
    description: TLS certificates of the platform, with an optional trust bundle and self-signed cluster issuers
    category: security
    maturity: stable
    edition: community
    license: Apache-2.0
    documentation: https://cert-manager.io/docs/
    maintainer: OKDP
    keywords: [certificates, tls, trust-manager]
    capabilities:
      - name: okdp.io/certificate-manager
    compatibility:
      kubernetes: ">=1.29.0"
    parameters: &parameters
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      additionalProperties: false
      properties:
        trust:
          type: object
          additionalProperties: false
          title: Trust bundle
          description: "trust-manager and the bundle of the platform CA certificates."
          x-okdp-group: Trust
          x-okdp-order: 1
          properties:
            enabled: { type: boolean, default: false, title: Enabled }
            bundle:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, default: certs-bundle, title: Bundle name }
                target:
                  type: object
                  additionalProperties: false
                  properties:
                    configMap:
                      type: object
                      additionalProperties: false
                      properties:
                        enabled: { type: boolean, default: false }
                        key: { type: string, default: "root-certs.pem" }
                    secret:
                      type: object
                      additionalProperties: false
                      properties:
                        enabled: { type: boolean, default: false }
                        key: { type: string, default: "ca.crt" }
        issuers:
          type: object
          additionalProperties: false
          title: Cluster issuers
          x-okdp-group: Issuers
          x-okdp-order: 1
          properties:
            enabled: { type: boolean, default: true, title: Enabled }
            selfSignedClusterIssuers:
              type: array
              title: Self-signed cluster issuers
              items:
                type: object
                additionalProperties: false
                required: [name]
                properties:
                  name: { type: string, minLength: 1 }
                  certificate:
                    type: object
                    additionalProperties: false
                    properties:
                      commonName: { type: string, default: "Self-Signed CA" }
                      organization: { type: string, default: "OKDP" }
                      country: { type: string, default: "US" }
                      validity: { type: string, default: "8760h" }
                      algorithm: { type: string, enum: [RSA, ECDSA, Ed25519], default: "ECDSA" }
                      size: { type: integer, default: 256 }
    lifecycle:
      applyTimeout: 15m
      rollback: supported

schema:
  parameters: *parameters
  context:
    properties:
      certificateIssuers:
        required: true
        properties:
          selfSigned:
            required: true
            properties:
              name: { type: string, required: true }
modules:
  - name: main
    timeout: 10m
    source:
      helmRepository:
        url: https://charts.jetstack.io
        chart: cert-manager
        version: v1.20.4
    values: |
      installCRDs: true
      enableCertificateOwnerRef: true
      image:
        repository: quay.io/jetstack/cert-manager-controller
      webhook:
        extraArgs:
          - "--dynamic-serving-leaf-duration=2160h"    # 90 days validity instead of 7 days
  - name: trust
    timeout: 10m
    enabled: "{{ .Parameters.trust.enabled }}"
    source:
      helmRepository:
        url: https://charts.jetstack.io
        chart: trust-manager
        version: v0.25.0
    values: |
      app:
        trust:
          namespace: {{ .Release.spec.targetNamespace }}
      secretTargets:
        enabled: {{ and .Parameters.trust.enabled .Parameters.trust.bundle.target.secret.enabled }}
        authorizedSecrets:
          - {{ .Parameters.trust.bundle.name }}
      image:
        repository: quay.io/jetstack/trust-manager
    dependsOn:
      - main
  - name: issuers
    enabled: "{{ .Parameters.issuers.enabled }}"
    timeout: 10m
    source:
      oci:
        repository: quay.io/okdp/charts/cert-issuers
        tag: 0.2.0
    values: |
      {{ toYaml .Parameters.issuers }}
      bundle:
        enabled: true
        name: {{ .Parameters.trust.bundle.name }}
        target:
          configMap:
            enabled: {{ .Parameters.trust.bundle.target.configMap.enabled }}
            key: {{ .Parameters.trust.bundle.target.configMap.key }}
          secret:
            enabled: {{ .Parameters.trust.bundle.target.secret.enabled }}
            key: {{ .Parameters.trust.bundle.target.secret.key }}
          additionalFormats:
            pkcs12:
              enabled: true
              key: "bundle.p12"
    dependsOn: |
      - main
      {{ if and .Parameters.trust.enabled }}
      - trust
      {{ end }}
roles:
  - okdp.io/certificate-manager
dependencies: []
